appId: com.mercury321.colamd.mercury
productName: ColaMD Mercury CE
copyright: Copyright © 2024-2026 marswave.ai

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*

extraResources:
  - from: resources/icon.png
    to: icon.png
  - from: resources/templates
    to: templates
  - from: resources/demo
    to: demo

npmArgs:
  - "--loglevel=error"

afterPack: ./scripts/afterPack.js

fileAssociations:
  - ext: md
    name: ColaMD Mercury定制版 Markdown Document
    role: Editor
    mimeType: text/markdown
  - ext: markdown
    name: ColaMD Mercury定制版 Markdown Document
    role: Editor
    mimeType: text/markdown
  - ext: mdown
    name: ColaMD Mercury定制版 Markdown Document
    role: Editor
    mimeType: text/markdown
  - ext: mkd
    name: ColaMD Mercury定制版 Markdown Document
    role: Editor
    mimeType: text/markdown

mac:
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  icon: resources/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  notarize: true

win:
  executableName: MercuryCustom
  target:
    - nsis
  icon: resources/icon.png

linux:
  target:
    - AppImage
    - deb
  category: Office
  icon: resources/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
